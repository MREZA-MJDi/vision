name: Storefront verification

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feat/storefront-video-reference-*'

permissions:
  contents: read

jobs:
  verify:
    name: Laravel tests and Vite build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run feature and unit tests
        run: php artisan test

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build storefront and admin assets
        run: npm run build
