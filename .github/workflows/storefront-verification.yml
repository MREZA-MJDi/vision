name: Storefront verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**', 'feat/**']

permissions:
  contents: read

jobs:
  storefront-tests:
    name: Storefront route tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run storefront route tests
        run: php artisan test tests/Feature/ExampleTest.php

  existing-suite:
    name: Full existing test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run existing feature and unit tests
        run: php artisan test

  mysql-storefront:
    name: Storefront on MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: storefront-ci
          MYSQL_DATABASE: vision_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: vision_test
      DB_USERNAME: root
      DB_PASSWORD: storefront-ci
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test tests/Feature/StorefrontBrowseTest.php tests/Feature/FittingRoomStudioTest.php

  frontend-build:
    name: Vite production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build storefront assets
        run: npm run build
